name: anvil-bootstrap

# One time bring up helper, not part of the ANVIL design. The API token used
# to build this repository can create issues but cannot apply labels to them
# or dispatch workflows (both return 403). This workflow runs on a push that
# touches the marker file, uses the workflow token to apply the anvil label
# to the demonstration issue, and then sends a repository_dispatch event,
# which is the documented way for a workflow token to start another workflow.
# It is removed after the demonstration run completes.

on:
  push:
    paths:
      - .github/bootstrap-trigger.txt

permissions:
  issues: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Apply the anvil label and dispatch the run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/3/labels" -f "labels[]=anvil" || true
          curl --fail -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/anvil-issue.yml/dispatches" \
            -d '{"ref":"main","inputs":{"issue_number":"3"}}'
          echo "Dispatched the anvil-issue workflow for issue 3"
